{% extends "base.html" %}
{% block content %}
<main class="section">
  <div class="container narrow">
    <p class="pill">Sicurezza admin</p>
    <h1>Configura autenticazione a due fattori</h1>
    <article class="card legal-copy">
      <p>Aggiungi questo codice segreto nella tua app autenticatore e inserisci il codice OTP corrente per completare la configurazione.</p>
      <p><strong>{{ secret }}</strong></p>
      <p>URI OTP:</p>
      <p><code>{{ provisioning_uri }}</code></p>
      <form class="form plain" method="post" action="/admin/2fa/setup">
        <label>Codice OTP<input type="text" name="code" required></label>
        <button class="btn primary" type="submit">Attiva 2FA</button>
      </form>
    </article>
  </div>
</main>
{% endblock %}
