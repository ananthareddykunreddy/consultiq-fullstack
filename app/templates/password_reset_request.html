{% extends "base.html" %}
{% block content %}
<main class="section">
  <div class="container auth-wrap">
    <div class="panel auth-panel">
      <p class="pill">Recupero password</p>
      <h1>Richiedi un link di accesso sicuro</h1>
      <p class="lead">Inserisci l'email usata per l'area cliente. Se l'indirizzo e' registrato, riceverai un link temporaneo.</p>
      {% if status %}<div class="flash success">{{ status }}</div>{% endif %}
      <form class="form plain" method="post" action="/password-reset-request">
        <label>Email<input type="email" name="email" required></label>
        <button class="btn primary" type="submit">Invia link di recupero</button>
      </form>
    </div>
  </div>
</main>
{% endblock %}
