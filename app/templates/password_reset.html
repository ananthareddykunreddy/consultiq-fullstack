{% extends "base.html" %}
{% block content %}
<main class="section"><div class="container auth-wrap"><div class="panel auth-panel"><p class="pill">Password Reset</p><h1>Set new password</h1>{% if error %}<div class="flash error">{{ error }}</div>{% endif %}<form class="form plain" method="post" action="/password-reset/{{ token }}"><label>New password<input type="password" name="password" required></label><button class="btn primary" type="submit">Update password</button></form></div></div></main>
{% endblock %}
