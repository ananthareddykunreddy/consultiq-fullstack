{% extends "base.html" %}
{% block content %}
<main class="section">
  <div class="container auth-wrap">
    <div class="panel auth-panel">
      <p class="pill">Nuova password</p>
      <h1>Imposta una nuova password</h1>
      <p class="lead">Scegli una password sicura di almeno 10 caratteri.</p>
      {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
      <form class="form plain" method="post" action="/password-reset/{{ token }}">
        <label>Nuova password<input type="password" name="password" required></label>
        <button class="btn primary" type="submit">Aggiorna password</button>
      </form>
    </div>
  </div>
</main>
{% endblock %}
